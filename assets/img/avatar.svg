<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="32" fill="#1f2937"/>

  <!-- 天线 -->
  <line x1="100" y1="40" x2="100" y2="65" stroke="#2dd4bf" stroke-width="3"/>
  <circle cx="100" cy="36" r="6" fill="#f97316"/>

  <!-- 头部 -->
  <rect x="50" y="65" width="100" height="85" rx="18" fill="none" stroke="#2dd4bf" stroke-width="3"/>

  <!-- 眼睛 -->
  <circle cx="78" cy="100" r="8" fill="#2dd4bf"/>
  <circle cx="122" cy="100" r="8" fill="#2dd4bf"/>

  <!-- 嘴巴（AI 信号线） -->
  <path d="M75 125 Q100 140 125 125" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>

  <!-- 耳朵 -->
  <rect x="38" y="95" width="12" height="25" rx="4" fill="#2dd4bf"/>
  <rect x="150" y="95" width="12" height="25" rx="4" fill="#2dd4bf"/>

  <!-- 底部代码括号（测试元素） -->
  <text x="100" y="180" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#2dd4bf" text-anchor="middle">&lt;/&gt;</text>
</svg>